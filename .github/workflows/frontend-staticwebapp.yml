name: Azure Static Web Apps CI/CD - Frontend

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-24.04
    name: Build and Deploy Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: frontend/youthaif-web
        run: npm ci

      - name: Build
        working-directory: frontend/youthaif-web
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # used for PR comments
          action: "upload"
          # Adjust the following paths if your frontend build outputs elsewhere
          app_location: "frontend/youthaif-web"
          api_location: ""
          output_location: "dist"
          app_build_command: "npm run build"
